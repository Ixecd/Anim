[package]
name = "animi"
version = "0.1.0"
edition = "2021"
description = "Anim 交织语言编译器——.anim 源码 → FSIR JSON"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
